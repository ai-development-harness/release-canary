name: Promote release-canary baseline to v0.11.3

on:
  push:
    branches:
      - promotion/v0.11.3

permissions:
  contents: write

concurrency:
  group: release-canary-promotion-v0.11.3
  cancel-in-progress: false

env:
  BASELINE_SHA: 8313e81edae508fec4a228342eb085668c38968d
  TARGET_TAG: v0.11.3
  TARGET_SHA: e76f471f6557e3b2758778f0c8f14a6b32ee273c

jobs:
  promote:
    name: Promote accepted stable baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Verify exact promotion identities
        shell: bash
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF_NAME" == "promotion/v0.11.3" ]]

          if ! git merge-base --is-ancestor "$BASELINE_SHA" HEAD; then
            echo "Accepted baseline $BASELINE_SHA is not an ancestor of promotion HEAD." >&2
            exit 1
          fi

          mapfile -t PRE_PROMOTION_PATHS < <(
            git diff --name-only "$BASELINE_SHA"...HEAD
          )
          if [[ "${#PRE_PROMOTION_PATHS[@]}" -ne 1 ]] ||
             [[ "${PRE_PROMOTION_PATHS[0]}" != ".github/workflows/promote-v0.11.3.yml" ]]; then
            printf 'Unexpected pre-promotion branch changes:\n%s\n' "${PRE_PROMOTION_PATHS[*]}" >&2
            exit 1
          fi

          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ "$MAIN_SHA" != "$BASELINE_SHA" ]]; then
            echo "release-canary/main moved: $MAIN_SHA != accepted baseline $BASELINE_SHA" >&2
            exit 1
          fi

          TARGET_REMOTE_SHA="$(
            git ls-remote               https://github.com/ai-development-harness/ai-development-harness-template.git               "refs/tags/$TARGET_TAG" |
              awk 'NR == 1 {print $1}'
          )"
          if [[ "$TARGET_REMOTE_SHA" != "$TARGET_SHA" ]]; then
            echo "Target tag $TARGET_TAG resolves to $TARGET_REMOTE_SHA, expected $TARGET_SHA" >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          import re

          manifest = Path(".harness/manifest.yaml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^  release: "([^"]+)"$', manifest)
          if not match or match.group(1) != "0.11.2":
              raise SystemExit("baseline manifest release must be 0.11.2")

          lock = json.loads(Path(".harness/harness.lock.json").read_text(encoding="utf-8"))
          if lock.get("release") != "0.11.2":
              raise SystemExit("baseline lock release must be 0.11.2")
          if (lock.get("source") or {}).get("ref") != "v0.11.2":
              raise SystemExit("baseline lock source.ref must be v0.11.2")
          PY

      - name: Snapshot project-owned baseline state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import fnmatch
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          baseline = os.environ["BASELINE_SHA"]

          def git_bytes(*args: str) -> bytes:
              proc = subprocess.run(
                  ["git", *args],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=True,
              )
              return proc.stdout

          update_policy = tomllib.loads(
              git_bytes("show", f"{baseline}:.harness/harness-update.toml").decode("utf-8")
          )
          ownership = update_policy["ownership"]
          patterns = []
          for name in ("harness_owned", "shared", "marker_merge"):
              patterns.extend(ownership[name])
          lock_path = update_policy["state"]["lock_file"]

          snapshot = {}
          for record in git_bytes("ls-tree", "-rz", "--full-tree", baseline).split(b"\0"):
              if not record:
                  continue
              meta, raw_path = record.split(b"\t", 1)
              mode, kind, oid = meta.decode("ascii").split()
              if kind != "blob":
                  continue
              path = raw_path.decode("utf-8")
              managed = path == lock_path or any(
                  fnmatch.fnmatchcase(path, pattern)
                  for pattern in patterns
              )
              if managed:
                  continue
              payload = git_bytes("cat-file", "blob", oid)
              snapshot[path] = {
                  "mode": mode,
                  "sha256": hashlib.sha256(payload).hexdigest(),
              }

          Path("/tmp/project-owned-before.json").write_text(
              json.dumps(snapshot, sort_keys=True, indent=2),
              encoding="utf-8",
          )
          print(f"project-owned baseline files: {len(snapshot)}")
          PY

      - name: Remove one-shot workflow before Harness validation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/promote-v0.11.3.yml

      - name: Apply accepted stable v0.11.3
        shell: bash
        run: |
          set -euo pipefail
          python3 .harness/tools/harness-update.py apply             --to "$TARGET_TAG"             --json |
            tee /tmp/apply.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/apply.json").read_text(encoding="utf-8"))
          if result.get("status") != "UPDATED":
              raise SystemExit(f"expected UPDATED, got {result}")
          if result.get("current") != "v0.11.3":
              raise SystemExit(f"unexpected current release: {result}")
          if result.get("resolvedTarget") != "v0.11.3":
              raise SystemExit(f"unexpected resolved target: {result}")
          PY

      - name: Resolve project schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          check_cmd = [
              sys.executable,
              ".harness/tools/migrate-project-schema.py",
              "--check",
              "--json",
          ]

          def check_schema():
              proc = subprocess.run(
                  check_cmd,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              data = json.loads(proc.stdout)
              return proc.returncode, data, proc.stderr

          code, data, stderr = check_schema()
          if data.get("status") == "MIGRATION_REQUIRED":
              migrate = subprocess.run(
                  [sys.executable, ".harness/tools/migrate-project-schema.py", "--json"],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              Path("/tmp/schema-migration.json").write_text(
                  migrate.stdout,
                  encoding="utf-8",
              )
              if migrate.returncode != 0:
                  raise SystemExit(
                      f"PROJECT RECONCILE primitive failed: {migrate.stderr}"
                  )
              code, data, stderr = check_schema()

          Path("/tmp/schema-final.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          if code != 0 or data.get("status") != "CURRENT":
              raise SystemExit(
                  f"project schema not current: code={code} data={data} stderr={stderr}"
              )
          PY

      - name: Run STATUS and DOCTOR
        shell: bash
        run: |
          set -euo pipefail

          python3 .harness/tools/harness-ux.py status --json | tee /tmp/status.json
          python3 .harness/tools/harness-ux.py doctor --json | tee /tmp/doctor.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          for name in ("status", "doctor"):
              data = json.loads(Path(f"/tmp/{name}.json").read_text(encoding="utf-8"))
              if data.get("status") != "PASS":
                  raise SystemExit(f"HARNESS {name.upper()} failed: {data}")
          PY

      - name: Run validator and full self-tests
        shell: bash
        run: |
          set -euo pipefail

          python3 .harness/tools/validate.py --mode manual
          python3 .harness/tools/run-self-tests.py --json | tee /tmp/self-tests.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/self-tests.json").read_text(encoding="utf-8"))
          if data.get("status") != "PASS":
              failed = [
                  item.get("test")
                  for item in data.get("results", [])
                  if item.get("status") != "PASS"
              ]
              raise SystemExit(f"full self-tests failed: {failed}")
          PY

      - name: Verify project-owned preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          before = json.loads(
              Path("/tmp/project-owned-before.json").read_text(encoding="utf-8")
          )
          failures = []

          for rel, expected in before.items():
              path = Path(rel)
              if not path.exists() or not path.is_file():
                  failures.append(f"missing project-owned file: {rel}")
                  continue

              actual_hash = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual_hash != expected["sha256"]:
                  failures.append(f"project-owned content changed: {rel}")

              executable = bool(path.stat().st_mode & 0o100)
              actual_mode = "100755" if executable else "100644"
              if expected["mode"] in {"100644", "100755"} and actual_mode != expected["mode"]:
                  failures.append(
                      f"project-owned mode changed: {rel}: "
                      f"{expected['mode']} -> {actual_mode}"
                  )

          if failures:
              raise SystemExit("\n".join(failures))

          Path("/tmp/preservation.json").write_text(
              json.dumps(
                  {
                      "status": "PASS",
                      "baselineProjectOwnedFiles": len(before),
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          print(f"project-owned preservation: PASS ({len(before)} files)")
          PY

      - name: Snapshot canonical working state before repeated APPLY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess

          root = Path.cwd()

          def git_z(*args: str) -> list[str]:
              proc = subprocess.run(
                  ["git", *args, "-z"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=True,
              )
              return [
                  token.decode("utf-8")
                  for token in proc.stdout.split(b"\0")
                  if token
              ]

          digest = hashlib.sha256()
          for rel in sorted(set(git_z("ls-files", "-c", "-o", "--exclude-standard"))):
              path = root / rel
              digest.update(rel.encode("utf-8"))
              digest.update(b"\0")
              if path.is_file():
                  digest.update(path.read_bytes())
              else:
                  digest.update(b"<missing>")
              digest.update(b"\0")

          Path("/tmp/canonical-before-repeat.txt").write_text(
              digest.hexdigest(),
              encoding="ascii",
          )
          PY

      - name: Prove repeated APPLY is NO_UPDATE
        shell: bash
        run: |
          set -euo pipefail

          python3 .harness/tools/harness-update.py apply             --to "$TARGET_TAG"             --json |
            tee /tmp/repeat-apply.json

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          result = json.loads(
              Path("/tmp/repeat-apply.json").read_text(encoding="utf-8")
          )
          if result.get("status") != "NO_UPDATE":
              raise SystemExit(f"repeated APPLY must be NO_UPDATE: {result}")
          if result.get("repositoryMutated"):
              raise SystemExit(f"repeated APPLY mutated repository: {result}")

          def git_z(*args: str) -> list[str]:
              proc = subprocess.run(
                  ["git", *args, "-z"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=True,
              )
              return [
                  token.decode("utf-8")
                  for token in proc.stdout.split(b"\0")
                  if token
              ]

          digest = hashlib.sha256()
          root = Path.cwd()
          for rel in sorted(set(git_z("ls-files", "-c", "-o", "--exclude-standard"))):
              path = root / rel
              digest.update(rel.encode("utf-8"))
              digest.update(b"\0")
              if path.is_file():
                  digest.update(path.read_bytes())
              else:
                  digest.update(b"<missing>")
              digest.update(b"\0")

          before = Path("/tmp/canonical-before-repeat.txt").read_text(
              encoding="ascii"
          ).strip()
          after = digest.hexdigest()
          if after != before:
              raise SystemExit(
                  f"repeated APPLY changed canonical working state: {before} -> {after}"
              )
          PY

      - name: Verify promoted manifest and lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re

          manifest = Path(".harness/manifest.yaml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^  release: "([^"]+)"$', manifest)
          if not match or match.group(1) != "0.11.3":
              raise SystemExit("promoted manifest release must be 0.11.3")

          lock = json.loads(Path(".harness/harness.lock.json").read_text(encoding="utf-8"))
          if lock.get("release") != "0.11.3":
              raise SystemExit("promoted lock release must be 0.11.3")
          if (lock.get("source") or {}).get("ref") != "v0.11.3":
              raise SystemExit("promoted lock source.ref must be v0.11.3")
          PY

      - name: Write durable promotion evidence
        shell: bash
        env:
          PROMOTION_RUN_URL: https://github.com/ai-development-harness/release-canary/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          apply = json.loads(Path("/tmp/apply.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("/tmp/schema-final.json").read_text(encoding="utf-8"))
          status = json.loads(Path("/tmp/status.json").read_text(encoding="utf-8"))
          doctor = json.loads(Path("/tmp/doctor.json").read_text(encoding="utf-8"))
          tests = json.loads(Path("/tmp/self-tests.json").read_text(encoding="utf-8"))
          preservation = json.loads(
              Path("/tmp/preservation.json").read_text(encoding="utf-8")
          )
          repeat = json.loads(
              Path("/tmp/repeat-apply.json").read_text(encoding="utf-8")
          )

          evidence = f"""---
          schema: 1
          ---
          # Baseline promotion — v0.11.3

          ## Identity

          - Accepted baseline commit: `{os.environ["BASELINE_SHA"]}`
          - Previous stable Harness: `v0.11.2`
          - Accepted target tag: `{os.environ["TARGET_TAG"]}`
          - Exact target Harness SHA: `{os.environ["TARGET_SHA"]}`
          - Promotion run: {os.environ["PROMOTION_RUN_URL"]}
          - Executed at: {datetime.now(timezone.utc).isoformat()}

          ## Gates

          | Gate | Result |
          | --- | --- |
          | Exact baseline / target identity | PASS |
          | Primary APPLY | {apply.get("status")} |
          | Project schema | {schema.get("status")} |
          | HARNESS STATUS | {status.get("status")} |
          | HARNESS DOCTOR | {doctor.get("status")} |
          | Validator | PASS |
          | Full self-tests | {tests.get("status")} ({tests.get("count")} tests) |
          | Project-owned preservation | {preservation.get("status")} ({preservation.get("baselineProjectOwnedFiles")} baseline files) |
          | Repeated APPLY | {repeat.get("status")} |
          | Repeated APPLY canonical mutation | {"FAIL" if repeat.get("repositoryMutated") else "PASS"} |

          ## Decision

          All mandatory promotion gates passed for exact published `v0.11.3`.
          This branch is eligible for independent PR review and Harness Integrity.
          Promotion to `main` still requires the PR to be reviewed and merged.
          """
          evidence = "\n".join(line.lstrip() for line in evidence.splitlines()) + "\n"

          path = Path("docs/baseline-promotions/v0.11.3.md")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(evidence, encoding="utf-8")
          PY

      - name: Commit successful promotion
        shell: bash
        run: |
          set -euo pipefail

          # GITHUB_TOKEN не может менять .github/workflows/**.
          # Эти два файла будут синхронизированы отдельными GitHub API commits
          # после успешного promotion run.
          git restore --source=HEAD --             .github/workflows/harness-integrity.yml             .github/workflows/promote-v0.11.3.yml

          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore(canary): promote baseline to v0.11.3"
          git push origin "HEAD:$GITHUB_REF_NAME"
